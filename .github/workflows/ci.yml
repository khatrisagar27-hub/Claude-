name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "claude/**"

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cae/backend
    env:
      # The test suite runs entirely against in-memory SQLite (see
      # tests/conftest.py), so no Postgres/Redis services are required.
      ENVIRONMENT: test
      SECRET_KEY: ci-test-secret-key-min-32-characters-long
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cae/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  cae2-backend:
    name: CAE v2 backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cae2/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: cae2/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # SQLite only; conftest.py sets its own throwaway database and secret.
      - name: Run tests
        run: pytest -q

  cae2-frontend:
    name: CAE v2 frontend (type-check and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cae2/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cae2/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check and build
        run: npm run build
